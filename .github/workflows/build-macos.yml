name: Build Aeryther macOS Beta
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake and JUCE
        run: cmake -S . -B build-mac -DAERYTHER_BUILD_PLUGIN=ON -DAERYTHER_FETCH_JUCE=ON -DAERYTHER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - name: Compile Aeryther and Aeryther FX
        run: cmake --build build-mac --config Release --parallel 2
      - name: Regression tests
        run: ctest --test-dir build-mac --output-on-failure
      - name: Prepare AU and VST3 artifacts
        run: |
          mkdir -p dist
          find build-mac -type d \( -name '*.vst3' -o -name '*.component' \) -exec cp -R {} dist/ \;
          test -n "$(ls -A dist)"
      - name: Re-sign completed plugin bundles and verify seals
        shell: bash
        run: |
          set -euo pipefail
          for bundle in dist/*.vst3 dist/*.component; do
            test -f "$bundle/Contents/Info.plist"
            test -x "$bundle/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$bundle/Contents/Info.plist")"
            codesign --force --sign - --verbose=2 "$bundle"
            codesign --verify --strict --verbose=2 "$bundle"
            echo "Verified: $bundle"
          done
      - name: Package executable bundles inside a permission-preserving ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          /usr/bin/zip -qry ../Aeryther-macOS-resigned-beta.zip -- *.vst3 *.component
          cd ..
          unzip -t Aeryther-macOS-resigned-beta.zip
      - name: Upload re-signed beta ZIP (not notarized)
        uses: actions/upload-artifact@v4
        with:
          name: Aeryther-macOS-beta-resigned
          path: Aeryther-macOS-resigned-beta.zip
          if-no-files-found: error

  validate:
    name: pluginval VST3 compatibility
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aeryther-macOS-beta-resigned
          path: beta-package
      - name: Expand signed beta bundles
        shell: bash
        run: |
          mkdir beta
          unzip -q beta-package/Aeryther-macOS-resigned-beta.zip -d beta
          for bundle in beta/*.vst3 beta/*.component; do codesign --verify --strict --verbose=2 "$bundle"; done
      - name: Download pluginval
        run: |
          curl -fLsS "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip" -o pluginval.zip
          unzip -q pluginval.zip -d pluginval-dist
          find pluginval-dist -type f -name pluginval
      - name: Validate Instrument and FX
        run: |
          PV=$(find pluginval-dist -type f -name pluginval | head -1)
          test -n "$PV"
          chmod +x "$PV"
          "$PV" --strictness-level 5 --skip-gui-tests --validate "beta/Aeryther.vst3"
          "$PV" --strictness-level 5 --skip-gui-tests --validate "beta/Aeryther FX.vst3"
